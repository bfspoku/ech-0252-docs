delivery
|-- deliveryHeader (Most of the info in the delivery header, we take directly from the sedex-envelope. So these elements are not important for us, except for the testDeliveryFlag)
|    |-- senderId
|    |-- messageId
|    |-- messageType
|    |-- sendingApplication
|    |    |-- manufacturer
|    |    |-- product
|    |    └── productVersion
|    |-- comment
|    |-- messageDate
|    |-- action
|    └── testDeliveryFlag (Mandatory & Important)
└── electionInformationDelivery
    |-- cantonId (Mandatory & Important)
    |-- pollingDay
    |-- electionGroupInfo
    |    |-- electionGroup
    |    |    |-- electionGroupIdentification (is optional in standard. Do we need/want it? GR does not provide it)
    |    |    |-- domainOfInfluence
    |    |    |    |-- domainOfIncluenceType (Mandatory & potentially important for us)
    |    |    |    |-- domainOfInfluenceIdentification (Mandatory & less important for us)
    |    |    |    |-- domainOfInfluenceName (Mandatory & less important for us)
    |    |    |    └── domainOfIncluenceShortName (Is this element even in the standard? Should be eCH-0155, but there is only domainOfInfluenceName)
    |    |    |-- SuperiorAuthority
    |    |    |    |-- domainOfIncluenceType (Mandatory & potentially important for us)
    |    |    |    |-- domainOfInfluenceIdentification (Mandatory & less important for us)
    |    |    |    |-- domainOfInfluenceName (Mandatory & less important for us)
    |    |    |    └── domainOfIncluenceShortName (Is this element even in the standard? Should be eCH-0155, but there is only domainOfInfluenceName)
    |    |    |-- electionGroupPosition
    |    |    └── electionInformation
    |    |        |-- election
    |    |        |    |-- electionIdentification (Mandatory & Important)
    |    |        |    |-- typeOfElection (Mandatory & Important)
    |    |        |    |-- electionDescription
    |    |        |    |    └── electionDescriptionInfo
    |    |        |    |        |-- language (Mandatory & Important)
    |    |        |    |        |-- electionDescriptionShort (Mandatory & Important)
    |    |        |    |        └── electionDescription (Mandatory & Important)
    |    |        |    └── numberOfMandates
    |    |        |-- otherIdentification
    |    |        |    |-- idName (Mandatory & Important)
    |    |        |    └── id (Mandatory & Important)
    |    |        |-- candidate
    |    |        |    |-- candidateIdentification (Mandatory & Important)
    |    |        |    |-- candidateReference (Mandatory & Important)
    |    |        |    |-- familyName (Mandatory & Important)
    |    |        |    |-- firstName (Mandatory & Important)
    |    |        |    |-- politicalFamilyName (Mandatory & Important)
    |    |        |    |-- politicalFirstName (Mandatory & Important)
    |    |        |    |-- callName (Unclear...?)
    |    |        |    |-- candidateText
    |    |        |    |    └── candidateTextInfo
    |    |        |    |        |-- language (Less important for us... BK?)
    |    |        |    |        └── candidateText (Less important for us... BK?)
    |    |        |    |-- dateOfBirth (Mandatory & Important; logic needed for cases when only yearOfBirth is known or delivered. For feedback-purposes it should be treated as mandatory)
    |    |        |    |-- sex (Mandatory & Important)
    |    |        |    |-- occupationalTitle
    |    |        |    |    └── occupationalTitleInfo
    |    |        |    |        |-- language (Optional and less important)
    |    |        |    |        └── occupationalTitle (Mandatory & Important)
    |    |        |    |-- dwellingAdress
