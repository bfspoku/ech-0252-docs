    |    |        |    |            └── candidateText
    |    |        |    └── emptyListPositions
    |    |        └── listUnion (Mandatory & Important; might be the case that in a first infoDelivery, this element is not yet included. Still, we should check for it in implementation/test phase)
    |    |            |-- listUnionIdentification
    |    |            |-- listUnionDescription
    |    |            |    └── listUnionDescriptionInfo
